[package]
name = "librepods"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = {version = "1.54.1", features = ["full"]}
bluer = { version = "0.17.4", features = ["full"] }
env_logger = {version = "0.11.11", features = ["auto-color"]}
uuid = "1.29.3"
log = "0.4.35"
dbus = "0.9.12"
hex = "0.4.3"
iced = { version = "0.14.0", features = ["tokio", "image", "canvas"] }
libpulse-binding = "2.30.1"
ksni = "0.3.7"
image = "0.25.8"
imageproc = "0.27.0"
ab_glyph = "0.2.32"
clap = { version = "4.6.8", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
aes = "0.9.4"
futures = "0.3.34"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 8
panic = "abort"
strip = true
