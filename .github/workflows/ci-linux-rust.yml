name: Linux CI (Rust)

on:
  push:
    branches:
      - linux/rust
    tags:
      - 'linux-v*'
    paths:
      - 'linux-rust/**'
      - '.github/workflows/ci-linux-rust.yml'
  pull_request:
    branches:
      - linux/rust
    paths:
      - 'linux-rust/**'
      - '.github/workflows/ci-linux-rust.yml'
  workflow_dispatch:

# A new push to the same branch (or PR) cancels the older run that's still in
# progress. Release tag builds are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    # Pinned to the oldest supported image: binaries need a glibc at least as new
    # as the one they were built against. ubuntu-latest moved to 26.04 (glibc
    # 2.43), and its AppImage failed on Ubuntu/Pop!_OS 24.04 (glibc 2.39).
    # 22.04 (glibc 2.35) covers Ubuntu 22.04+, Debian 12+ and other current distros.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          # libxkbcommon-dev is needed by the COSMIC applet (libcosmic).
          sudo apt-get install -y pkg-config libdbus-1-dev libpulse-dev libxkbcommon-dev appstream just libfuse2

      - name: Install AppImage tools
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O /usr/local/bin/linuxdeploy
          chmod +x /usr/local/bin/{appimagetool,linuxdeploy}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            linux-rust -> target
            linux-rust/cosmic-applet -> target

      - name: Run tests
        working-directory: linux-rust
        run: cargo test --release --locked

      - name: Build AppImage and Binary
        working-directory: linux-rust
        run: |
          cargo build --release --locked --verbose
          just
          mkdir -p dist
          cp target/release/librepods dist/librepods
          mv dist/LibrePods-x86_64.AppImage dist/librepods-x86_64.AppImage

      - name: Build COSMIC applet
        working-directory: linux-rust/cosmic-applet
        run: |
          cargo build --release --locked
          cp target/release/librepods-cosmic-applet ../dist/librepods-cosmic-applet

      - name: Check glibc compatibility
        working-directory: linux-rust/dist
        run: |
          max_allowed=2.35
          for bin in librepods librepods-cosmic-applet; do
            needed=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
            echo "$bin requires glibc $needed"
            if [ "$(printf '%s\n%s\n' "$needed" "$max_allowed" | sort -V | tail -1)" != "$max_allowed" ]; then
              echo "::error::$bin requires glibc $needed (> $max_allowed); it won't run on older distros"
              exit 1
            fi
          done

      - name: Upload AppImage artifact
        if: "!startsWith(github.ref, 'refs/tags/linux-v')"
        uses: actions/upload-artifact@v7
        with:
          name: librepods-x86_64.AppImage
          path: linux-rust/dist/librepods-x86_64.AppImage

      - name: Upload binary artifact
        if: "!startsWith(github.ref, 'refs/tags/linux-v')"
        uses: actions/upload-artifact@v7
        with:
          name: librepods
          path: linux-rust/dist/librepods

      - name: Upload COSMIC applet artifact
        if: "!startsWith(github.ref, 'refs/tags/linux-v')"
        uses: actions/upload-artifact@v7
        with:
          name: librepods-cosmic-applet
          path: linux-rust/dist/librepods-cosmic-applet

      - name: Create tarball for Flatpak
        if: startsWith(github.ref, 'refs/tags/linux-v')
        working-directory: linux-rust
        run: |
          VERSION="${GITHUB_REF_NAME#linux-v}"
          just tarball "${VERSION}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "TAR_PATH=linux-rust/dist/librepods-v${VERSION}-source.tar.gz" >> $GITHUB_ENV

      - name: Create GitHub Release (AppImage + binary + applet + source)
        if: startsWith(github.ref, 'refs/tags/linux-v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            linux-rust/dist/librepods-v${{ env.VERSION }}-source.tar.gz
            linux-rust/dist/librepods-x86_64.AppImage
            linux-rust/dist/librepods
            linux-rust/dist/librepods-cosmic-applet
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
